services:
  postgres:
    image: postgres:16-alpine
    container_name: bilan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bilan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bilan_password}
      POSTGRES_DB: ${POSTGRES_DB:-bilan_easy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bilan_user} -d ${POSTGRES_DB:-bilan_easy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bilan-backend
    # Environment variables are set in 'environment:' section below
    # env_file is commented out to avoid conflicts - use docker-compose.yml environment variables
    # env_file:
    #   - backend/.env
    #   - backend/.env.local
    #   - .env
    #   - .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bilan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bilan_password}
      POSTGRES_DB: ${POSTGRES_DB:-bilan_easy}
      # DATABASE_URL must use POSTGRES_DB (bilan_easy), not POSTGRES_USER (bilan_user)
      DATABASE_URL: postgresql://${POSTGRES_USER:-bilan_user}:${POSTGRES_PASSWORD:-bilan_password}@postgres:5432/${POSTGRES_DB:-bilan_easy}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TEST_MODE: ${TEST_MODE:-false}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      GEMINI_MAX_CONCURRENCY: ${GEMINI_MAX_CONCURRENCY:-2}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      # Optional: AI API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional: Monitoring
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLE_DEV: ${SENTRY_ENABLE_DEV:-false}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Load from .env or .env.local file (docker-compose automatically loads .env files)
        # Priority: .env > .env.local > default
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
        GEMINI_API_KEY: ${GEMINI_API_KEY:-${VITE_GEMINI_API_KEY:-}}
        VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
        VITE_CLAUDE_API_KEY: ${VITE_CLAUDE_API_KEY:-}
        VITE_GEMINI_MAX_CONCURRENCY: ${VITE_GEMINI_MAX_CONCURRENCY:-2}
        VITE_GEMINI_FALLBACK_MODEL: ${VITE_GEMINI_FALLBACK_MODEL:-}
    env_file:
      - .env.local
      - .env
    container_name: bilan-frontend
    environment:
      # For Docker: Frontend runs in browser, so use localhost for API access
      # This is correct because the browser (not the container) makes API requests
      VITE_API_URL: http://localhost:3001/api
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      # Pass AI keys to runtime environment injection
      VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
      VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
      VITE_CLAUDE_API_KEY: ${VITE_CLAUDE_API_KEY:-}
      VITE_GEMINI_MAX_CONCURRENCY: ${VITE_GEMINI_MAX_CONCURRENCY:-2}
      VITE_GEMINI_FALLBACK_MODEL: ${VITE_GEMINI_FALLBACK_MODEL:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

